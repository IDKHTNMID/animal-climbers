// ---------- Map geometry and colour helpers (shared by map views and panels) ----------
const VIEW_W = 600;
const VIEW_H = 400;
const PLOT_1D = Object.freeze({ left: 44, right: 584, top: 24, bottom: 372 });
const SQUARE = Object.freeze({ left: 110, top: 10, size: 380 });
const SQUARE_ONLY = Object.freeze({ left: 10, top: 10, size: 380 });
const TERRAIN_STOPS = [[0, [43, 76, 140]], [0.35, [91, 178, 106]], [0.7, [217, 179, 108]], [1, [255, 255, 255]]];
const FOG_COLOR = '#dfe7ef';
const GOLD = '#E9B949';
const TABU_COLOR = 'rgba(255,140,40,0.55)';
const REMOVED_COLOR = '#dc2626';
const ADDED_COLOR = '#16a34a';
const ROUTE_COLOR = '#7a6a58';

function terrainColor(value) {
  const t = clamp(value / HEIGHT_MAX, 0, 1);
  for (let k = 1; k < TERRAIN_STOPS.length; k++) {
    const [t1, c1] = TERRAIN_STOPS[k];
    const [t0, c0] = TERRAIN_STOPS[k - 1];
    if (t <= t1) {
      const f = (t - t0) / (t1 - t0);
      return c0.map((v, i) => Math.round(v + (c1[i] - v) * f));
    }
  }
  return TERRAIN_STOPS[TERRAIN_STOPS.length - 1][1];
}

const terrainCss = (value) => `rgb(${terrainColor(value).join(',')})`;
/** Dark text on light terrain, white text on the dark blue lowlands. */
const terrainInk = (value) => (value < 30 ? '#ffffff' : '#3d2f22');

const x1d = (x) => PLOT_1D.left + (x / (SIZE_1D - 1)) * (PLOT_1D.right - PLOT_1D.left);
const y1d = (v) => PLOT_1D.bottom - (v / HEIGHT_MAX) * (PLOT_1D.bottom - PLOT_1D.top);

function posKey(type, pos) {
  return type === '2d' ? `${pos.x},${pos.y}` : String(pos);
}

function makeOffscreen(w, h, paint) {
  const c = document.createElement('canvas');
  c.width = w;
  c.height = h;
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(w, h);
  paint(img.data);
  ctx.putImageData(img, 0, 0);
  return c;
}

function terrainImage(problem) {
  return makeOffscreen(SIZE_2D, SIZE_2D, (data) => {
    problem.values.forEach((v, i) => data.set([...terrainColor(v), 255], i * 4));
  });
}

function fogImage(revealed) {
  return makeOffscreen(SIZE_2D, SIZE_2D, (data) => {
    for (let i = 0; i < SIZE_2D * SIZE_2D; i++) {
      const key = `${i % SIZE_2D},${Math.floor(i / SIZE_2D)}`;
      data.set(revealed.has(key) ? [0, 0, 0, 0] : [223, 231, 239, 255], i * 4);
    }
  });
}

function pointSegmentDistance(p, a, b) {
  const dx = b.x - a.x;
  const dy = b.y - a.y;
  const len2 = dx * dx + dy * dy || 1;
  const t = clamp(((p.x - a.x) * dx + (p.y - a.y) * dy) / len2, 0, 1);
  return Math.hypot(p.x - (a.x + t * dx), p.y - (a.y + t * dy));
}

/** Proper intersection point of segments p1p2 and p3p4, or null. */
function segmentIntersection(p1, p2, p3, p4) {
  const d = (p2.x - p1.x) * (p4.y - p3.y) - (p2.y - p1.y) * (p4.x - p3.x);
  if (Math.abs(d) < 1e-9) return null;
  const t = ((p3.x - p1.x) * (p4.y - p3.y) - (p3.y - p1.y) * (p4.x - p3.x)) / d;
  const u = ((p3.x - p1.x) * (p2.y - p1.y) - (p3.y - p1.y) * (p2.x - p1.x)) / d;
  if (t <= 1e-6 || t >= 1 - 1e-6 || u <= 1e-6 || u >= 1 - 1e-6) return null;
  return { x: p1.x + t * (p2.x - p1.x), y: p1.y + t * (p2.y - p1.y) };
}

/** Edge k of a tour joins tour[k] and tour[k + 1] (wrapping). */
function tourEdge(tour, k) {
  return [tour[k], tour[(k + 1) % tour.length]];
}

/** Crossing points between non-adjacent edges of a tour (city coordinates, 0..100). */
function tourCrossings(problem, tour) {
  const n = tour.length;
  const pts = [];
  for (let k = 0; k < n; k++) {
    for (let m = k + 2; m < n; m++) {
      if (k === 0 && m === n - 1) continue;
      const [a, b] = tourEdge(tour, k);
      const [c, d] = tourEdge(tour, m);
      const hit = segmentIntersection(problem.cities[a], problem.cities[b], problem.cities[c], problem.cities[d]);
      if (hit) pts.push({ ...hit, edges: [k, m] });
    }
  }
  return pts;
}

/** Edge change of a 2-opt move: two removed edges and two added edges. */
function twoOptEdges(move) {
  return { removed: [[move.a, move.b], [move.c, move.d]], added: [[move.a, move.c], [move.b, move.d]] };
}

// ===== map-view.js =====
// ---------- Map canvas (spec 4.2): core, agents, bubbles, 1D and 2D drawing ----------
const HOP_PX = 6;
const EFFECT_MS = 600;
const SHAKE_MS = 420;
const CITY_HIT_PX = 14;
const EDGE_HIT_PX = 9;

class MapView {
  /**
   * opts: { compact, showCandidates, bubbles, square, onClick(info), onEdgeClick({ edge }) }
   * square: a 1:1 canvas used for TSP small multiples and thumbnails.
   */
  constructor(canvas, opts = {}) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.opts = { compact: false, showCandidates: false, bubbles: false, square: false, onClick: null, onEdgeClick: null, ...opts };
    this.W = this.opts.square ? 400 : VIEW_W;
    this.H = VIEW_H;
    this.sq = this.opts.square ? SQUARE_ONLY : SQUARE;
    this.problem = null;
    this.agents = [];
    this.anim = new Map();
    this.showAnswer = false;
    this.fog = null;
    this.userPath = null;
    this.userTour = null;
    this.edgeChange = null;
    this.selectedEdges = [];
    this.crossings = null;
    this.explain = null;
    this.hover = null;
    this.tweenMs = 200;
    canvas.addEventListener('click', (e) => this.handleClick(e));
    canvas.addEventListener('mousemove', (e) => { this.hover = this.toLogical(e); });
    canvas.addEventListener('mouseleave', () => { this.hover = null; });
    this.frame = this.frame.bind(this);
    requestAnimationFrame(this.frame);
  }

  get cell() {
    return this.sq.size / SIZE_2D;
  }

  setProblem(problem) {
    this.problem = problem;
    this.terrain = problem.type === '2d' ? terrainImage(problem) : null;
    this.agents = [];
    this.anim.clear();
    this.fog = null;
    this.fogCanvas = null;
    this.userPath = null;
    this.userTour = null;
    this.edgeChange = null;
    this.selectedEdges = [];
    this.crossings = null;
    this.explain = null;
  }

  /** fog: null or { revealed: Set<key>, targets: [pos] }. */
  setFog(fog) {
    this.fog = fog;
    this.fogCanvas = fog && this.problem.type === '2d' ? fogImage(fog.revealed) : null;
  }

  setSpeed(stepsPerSecond) {
    this.tweenMs = Math.min(250, (1000 / stepsPerSecond) * 0.8);
  }

  /** agents: [{ key, run }]. Detects new records to trigger hop / shake / sparkle effects. */
  setAgents(agents) {
    const now = performance.now();
    const keys = new Set(agents.map((a) => a.key));
    [...this.anim.keys()].filter((k) => !keys.has(k)).forEach((k) => this.anim.delete(k));
    agents.forEach((a) => {
      const prev = this.anim.get(a.key);
      const count = a.run.records.length;
      if (!prev || count < prev.count || prev.run.problem !== a.run.problem) {
        this.anim.set(a.key, { run: a.run, count, from: null, t0: 0, effect: null });
        return;
      }
      if (count === prev.count) {
        this.anim.set(a.key, { ...prev, run: a.run });
        return;
      }
      const rec = lastRecord(a.run);
      const moved = rec.to !== rec.from;
      const effect = rec.event === 'reject' ? { text: '✗', shake: true, t0: now }
        : rec.isNewBest ? { text: '✨', shake: false, t0: now } : prev.effect;
      this.anim.set(a.key, {
        run: a.run, count, effect,
        from: moved ? this.currentPx(prev, now) : prev.from, t0: moved ? now : prev.t0,
      });
    });
    this.agents = agents;
  }

  toLogical(e) {
    const rect = this.canvas.getBoundingClientRect();
    return { x: ((e.clientX - rect.left) / rect.width) * this.W, y: ((e.clientY - rect.top) / rect.height) * this.H };
  }

  cityPx(c) {
    return { x: this.sq.left + (c.x / 100) * this.sq.size, y: this.sq.top + (c.y / 100) * this.sq.size };
  }

  /** Translates a click into { pos } (1D/2D), { city } or { edge } (TSP). */
  handleClick(e) {
    if (!this.problem) return;
    const p = this.toLogical(e);
    const type = this.problem.type;
    if (type === 'tsp') {
      this.handleTspClick(p);
      return;
    }
    if (!this.opts.onClick) return;
    if (type === '1d') {
      if (p.x < PLOT_1D.left - 6 || p.x > PLOT_1D.right + 6) return;
      const x = Math.round(((p.x - PLOT_1D.left) / (PLOT_1D.right - PLOT_1D.left)) * (SIZE_1D - 1));
      this.opts.onClick({ pos: clamp(x, 0, SIZE_1D - 1) });
      return;
    }
    const cx = Math.floor((p.x - this.sq.left) / this.cell);
    const cy = Math.floor((p.y - this.sq.top) / this.cell);
    if (cx >= 0 && cy >= 0 && cx < SIZE_2D && cy < SIZE_2D) this.opts.onClick({ pos: point2d(cx, cy) });
  }

  handleTspClick(p) {
    const tour = this.userTour || (this.agents[0] && this.agents[0].run.state.current.pos);
    if (this.opts.onEdgeClick && tour) {
      let best = { k: -1, d: Infinity };
      for (let k = 0; k < tour.length; k++) {
        const [u, v] = tourEdge(tour, k);
        const d = pointSegmentDistance(p, this.cityPx(this.problem.cities[u]), this.cityPx(this.problem.cities[v]));
        if (d < best.d) best = { k, d };
      }
      if (best.d <= EDGE_HIT_PX) this.opts.onEdgeClick({ edge: best.k });
      return;
    }
    if (!this.opts.onClick) return;
    const hit = this.problem.cities.findIndex((c) => {
      const q = this.cityPx(c);
      return Math.hypot(q.x - p.x, q.y - p.y) <= CITY_HIT_PX;
    });
    if (hit >= 0) this.opts.onClick({ city: hit });
  }

  posPx(pos) {
    if (this.problem.type === '1d') return { x: x1d(pos), y: y1d(this.problem.values[pos]) };
    return { x: this.sq.left + (pos.x + 0.5) * this.cell, y: this.sq.top + (pos.y + 0.5) * this.cell };
  }

  currentPx(entry, now) {
    const target = this.posPx(entry.run.state.current.pos);
    if (!entry.from) return target;
    const t = clamp((now - entry.t0) / this.tweenMs, 0, 1);
    return { x: entry.from.x + (target.x - entry.from.x) * t, y: entry.from.y + (target.y - entry.from.y) * t };
  }

  resize() {
    const w = this.canvas.clientWidth;
    if (!w) return false;
    const dpr = window.devicePixelRatio || 1;
    const width = Math.round(w * dpr);
    const height = Math.round(((w * this.H) / this.W) * dpr);
    if (this.canvas.width !== width || this.canvas.height !== height) {
      this.canvas.width = width;
      this.canvas.height = height;
    }
    const k = width / this.W;
    this.ctx.setTransform(k, 0, 0, k, 0, 0);
    return true;
  }

  /** Stops the animation loop; used for throw-away thumbnails. */
  destroy() {
    this.destroyed = true;
  }

  frame(now) {
    if (this.destroyed) return;
    requestAnimationFrame(this.frame);
    if (!this.problem || !this.canvas.isConnected || this.canvas.offsetParent === null || !this.resize()) return;
    const ctx = this.ctx;
    ctx.clearRect(0, 0, this.W, this.H);
    const type = this.problem.type;
    if (type === '1d') this.draw1d(ctx);
    else if (type === '2d') this.draw2d(ctx);
    else this.drawTsp(ctx);
    if (type !== 'tsp') this.drawAgents(ctx, now);
    if (type !== 'tsp' && !this.fog && this.hover && !this.opts.compact) this.drawHover(ctx);
  }

  primaryRecord() {
    if (!this.opts.showCandidates || this.agents.length !== 1) return null;
    return lastRecord(this.agents[0].run);
  }

  // ----- 1D -----
  draw1d(ctx) {
    ctx.fillStyle = '#EAF4FB';
    ctx.fillRect(PLOT_1D.left, PLOT_1D.top, PLOT_1D.right - PLOT_1D.left, PLOT_1D.bottom - PLOT_1D.top);
    if (!this.opts.compact) this.draw1dAxes(ctx);
    if (this.fog) this.draw1dFog(ctx);
    else {
      ctx.beginPath();
      ctx.moveTo(x1d(0), PLOT_1D.bottom);
      this.problem.values.forEach((v, x) => ctx.lineTo(x1d(x), y1d(v)));
      ctx.lineTo(x1d(SIZE_1D - 1), PLOT_1D.bottom);
      ctx.closePath();
      ctx.fillStyle = '#9ED88E';
      ctx.fill();
      ctx.strokeStyle = '#4E9F3D';
      ctx.lineWidth = 2;
      ctx.stroke();
    }
    this.drawOverlays(ctx);
  }

  draw1dAxes(ctx) {
    ctx.strokeStyle = 'rgba(80,100,120,0.15)';
    ctx.lineWidth = 1;
    ctx.fillStyle = '#7a6a58';
    ctx.font = '11px system-ui, sans-serif';
    ctx.textAlign = 'right';
    [0, 25, 50, 75, 100].forEach((v) => {
      ctx.beginPath();
      ctx.moveTo(PLOT_1D.left, y1d(v));
      ctx.lineTo(PLOT_1D.right, y1d(v));
      ctx.stroke();
      ctx.fillText(String(v), PLOT_1D.left - 6, y1d(v) + 4);
    });
    ctx.textAlign = 'center';
    [0, 50, 100, 150, 199].forEach((x) => ctx.fillText(String(x), x1d(x), PLOT_1D.bottom + 16));
  }

  draw1dFog(ctx) {
    ctx.fillStyle = FOG_COLOR;
    ctx.fillRect(PLOT_1D.left, PLOT_1D.top, PLOT_1D.right - PLOT_1D.left, PLOT_1D.bottom - PLOT_1D.top);
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.font = '28px system-ui, sans-serif';
    for (let k = 0; k < 8; k++) ctx.fillText('☁', 90 + k * 65, 70 + (k % 3) * 90);
    ctx.textAlign = 'center';
    this.fog.revealed.forEach((key) => {
      const x = Number(key);
      const v = this.problem.values[x];
      ctx.fillStyle = '#9ED88E';
      ctx.fillRect(x1d(x) - 4, y1d(v), 8, PLOT_1D.bottom - y1d(v));
      ctx.fillStyle = '#2f6b25';
      ctx.font = '10px system-ui, sans-serif';
      ctx.fillText(fmt1(v), x1d(x), y1d(v) - 6);
    });
    (this.fog.targets || []).forEach((x) => this.dashedBox(ctx, x1d(x) - 7, y1d(this.problem.values[x]) - 7, 14, 14, '#FF9F43'));
  }

  // ----- 2D -----
  draw2d(ctx) {
    const { left, top, size } = this.sq;
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(this.terrain, left, top, size, size);
    if (this.fogCanvas) ctx.drawImage(this.fogCanvas, left, top, size, size);
    ctx.strokeStyle = '#8a7660';
    ctx.lineWidth = 2;
    ctx.strokeRect(left, top, size, size);
    if (!this.opts.compact && !this.opts.square) this.drawLegend(ctx);
    this.drawOverlays(ctx);
  }

  drawLegend(ctx) {
    const x = 520;
    const top = 40;
    const bottom = 340;
    for (let y = top; y <= bottom; y++) {
      ctx.fillStyle = terrainCss(((bottom - y) / (bottom - top)) * HEIGHT_MAX);
      ctx.fillRect(x, y, 16, 1);
    }
    ctx.strokeStyle = '#8a7660';
    ctx.lineWidth = 1;
    ctx.strokeRect(x, top, 16, bottom - top);
    ctx.fillStyle = '#7a6a58';
    ctx.font = '11px system-ui, sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('100', x + 22, top + 4);
    ctx.fillText('50', x + 22, (top + bottom) / 2 + 4);
    ctx.fillText('0', x + 22, bottom + 4);
    ctx.fillText('高度', x - 2, top - 12);
  }

  drawOverlays(ctx) {
    this.drawTabu(ctx);
    this.drawCandidates(ctx);
    this.drawTrails(ctx);
    this.drawUserPath(ctx);
    this.drawAnswer(ctx);
  }

  drawTabu(ctx) {
    const rec = this.primaryRecord();
    const agent = this.agents[0];
    if (!rec || agent.run.algo !== 'ts') return;
    ctx.font = 'bold 12px system-ui, sans-serif';
    ctx.textAlign = 'center';
    agent.run.state.tabu.forEach((entry) => {
      const parts = entry.keys[0].split(',').map(Number);
      const pos = this.problem.type === '2d' ? point2d(parts[0], parts[1]) : parts[0];
      const q = this.posPx(pos);
      const size = this.problem.type === '2d' ? this.cell + 2 : 12;
      ctx.fillStyle = TABU_COLOR;
      ctx.fillRect(q.x - size / 2, q.y - size / 2, size, size);
      ctx.fillStyle = '#7a3d00';
      ctx.fillText('✕', q.x, q.y + 4);
    });
  }

  drawCandidates(ctx) {
    const rec = this.primaryRecord();
    if (!rec) return;
    const from = this.posPx(rec.from.pos);
    rec.candidates.forEach((c) => {
      const q = this.posPx(c.move);
      ctx.strokeStyle = c.tabu ? '#FF8C28' : c.better ? ADDED_COLOR : REMOVED_COLOR;
      ctx.fillStyle = ctx.strokeStyle;
      ctx.lineWidth = 2;
      if (this.problem.type === '2d') ctx.strokeRect(q.x - this.cell / 2, q.y - this.cell / 2, this.cell, this.cell);
      else {
        ctx.beginPath();
        ctx.arc(q.x, q.y, 4.5, 0, Math.PI * 2);
        ctx.fill();
      }
    });
    if (rec.chosen === null) return;
    const to = this.posPx(rec.chosen);
    ctx.setLineDash([4, 3]);
    ctx.strokeStyle = '#3d2f22';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(from.x, from.y);
    ctx.lineTo(to.x, to.y);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  drawTrails(ctx) {
    this.agents.forEach(({ run }) => {
      const color = ALGOS[run.algo].color;
      const points = [run.records.length ? run.records[0].from.pos : run.state.current.pos,
        ...run.records.filter((r) => r.to !== r.from).map((r) => r.to.pos)].map((pos) => this.posPx(pos));
      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      ctx.globalAlpha = 0.75;
      ctx.lineWidth = 2;
      ctx.beginPath();
      points.forEach((q, i) => (i ? ctx.lineTo(q.x, q.y) : ctx.moveTo(q.x, q.y)));
      ctx.stroke();
      points.forEach((q) => {
        ctx.beginPath();
        ctx.arc(q.x, q.y, 2, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;
    });
  }

  drawUserPath(ctx) {
    if (!this.userPath) return;
    const points = this.userPath.map((pos) => this.posPx(pos));
    ctx.strokeStyle = '#3d2f22';
    ctx.fillStyle = '#3d2f22';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    points.forEach((q, i) => (i ? ctx.lineTo(q.x, q.y) : ctx.moveTo(q.x, q.y)));
    ctx.stroke();
    points.forEach((q) => {
      ctx.beginPath();
      ctx.arc(q.x, q.y, 3, 0, Math.PI * 2);
      ctx.fill();
    });
    const last = points[points.length - 1];
    ctx.font = '22px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('🙋', last.x, last.y - 8);
  }

  drawAnswer(ctx) {
    if (!this.showAnswer) return;
    const q = this.posPx(this.problem.global.state);
    ctx.font = '22px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('⭐', q.x, q.y + 8);
  }

  dashedBox(ctx, x, y, w, hgt, color) {
    ctx.setLineDash([3, 2]);
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.strokeRect(x, y, w, hgt);
    ctx.setLineDash([]);
  }

  drawAgents(ctx, now) {
    const size = this.problem.type === '1d' ? 40 : 30;
    const seen = new Map();
    this.agents.forEach(({ key, run }) => {
      const entry = this.anim.get(key);
      if (!entry) return;
      const k = posKey(this.problem.type, run.state.current.pos);
      const overlap = seen.get(k) || 0;
      seen.set(k, overlap + 1);
      const base = this.currentPx(entry, now);
      const hopT = entry.from ? clamp((now - entry.t0) / this.tweenMs, 0, 1) : 1;
      const reduced = prefersReducedMotion();
      const hop = reduced || hopT >= 1 ? 0 : -HOP_PX * Math.sin(Math.PI * hopT);
      const shakeT = entry.effect && entry.effect.shake ? (now - entry.effect.t0) / SHAKE_MS : 1;
      const shake = !reduced && shakeT < 1 ? Math.sin(shakeT * Math.PI * 4) * 4 : 0;
      const x = base.x + overlap * 6 + shake;
      const anchorY = this.problem.type === '1d' ? base.y - size + 4 : base.y - size / 2;
      const y = anchorY + overlap * 6 + hop;
      const img = agentImage(ALGOS[run.algo].icon);
      if (img.complete) ctx.drawImage(img, x - size / 2, y, size, size);
      this.drawEffect(ctx, entry, run, x, y, now);
      if (this.opts.bubbles && run.records.length) this.drawSpeech(ctx, shortNarration(run, lastRecord(run)), x, y - 6, ALGOS[run.algo].color);
    });
  }

  drawEffect(ctx, entry, run, x, y, now) {
    ctx.font = '16px system-ui, sans-serif';
    ctx.textAlign = 'center';
    if (run.state.stopped) {
      ctx.fillText('💤', x + 18, y + 6);
      return;
    }
    if (!entry.effect) return;
    const age = now - entry.effect.t0;
    if (age > EFFECT_MS) return;
    ctx.globalAlpha = 1 - age / EFFECT_MS;
    ctx.fillStyle = entry.effect.text === '✗' ? REMOVED_COLOR : '#b8860b';
    ctx.font = 'bold 18px system-ui, sans-serif';
    ctx.fillText(entry.effect.text, x - 18, y + 4 - age / 40);
    ctx.globalAlpha = 1;
  }

  /** Rounded speech bubble whose tail points down at (x, y). */
  drawSpeech(ctx, text, x, y, color) {
    if (!text) return;
    ctx.font = 'bold 13px system-ui, sans-serif';
    const w = ctx.measureText(text).width + 16;
    const h = 24;
    const bx = clamp(x - w / 2, 2, this.W - w - 2);
    const by = Math.max(2, y - h - 8);
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(bx, by, w, h, 10);
    ctx.fill();
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(clamp(x, bx + 10, bx + w - 10) - 5, by + h);
    ctx.lineTo(clamp(x, bx + 10, bx + w - 10), by + h + 7);
    ctx.lineTo(clamp(x, bx + 10, bx + w - 10) + 5, by + h);
    ctx.fill();
    ctx.fillStyle = '#3d2f22';
    ctx.textAlign = 'center';
    ctx.fillText(text, bx + w / 2, by + 16);
  }

  drawHover(ctx) {
    const { x, y } = this.hover;
    let label = null;
    if (this.problem.type === '1d' && x >= PLOT_1D.left && x <= PLOT_1D.right) {
      const px = Math.round(((x - PLOT_1D.left) / (PLOT_1D.right - PLOT_1D.left)) * (SIZE_1D - 1));
      label = `x=${px}  高度 ${fmt1(this.problem.values[px])}`;
    } else if (this.problem.type === '2d') {
      const cx = Math.floor((x - this.sq.left) / this.cell);
      const cy = Math.floor((y - this.sq.top) / this.cell);
      if (cx >= 0 && cy >= 0 && cx < SIZE_2D && cy < SIZE_2D) {
        label = `(${cx},${cy})  高度 ${fmt1(this.problem.values[cy * SIZE_2D + cx])}`;
      }
    }
    if (!label) return;
    ctx.font = '12px system-ui, sans-serif';
    const w = ctx.measureText(label).width + 12;
    const bx = clamp(x + 12, 0, this.W - w);
    const by = clamp(y - 28, 0, this.H - 22);
    ctx.fillStyle = 'rgba(61,47,34,0.88)';
    ctx.fillRect(bx, by, w, 20);
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'left';
    ctx.fillText(label, bx + 6, by + 14);
  }
}

// ===== map-view-tsp.js =====
// ---------- Map canvas: TSP drawing (spec v1.2 items 3, 4, 9; beginner details in spec v1.3) ----------
// Removed edges are red dashed with a scissors mark, added edges are green. A single route also shows
// the home city 🏠, direction arrows and the length of every edge.
const EDGE_LABEL_MAX_CITIES = 12;
const ARROW_AT = 0.36;
const TABU_EDGE_COLOR = '#f97316';
const LABEL_SLOTS = Object.freeze([0.5, 0.64, 0.36, 0.74, 0.26]);

Object.assign(MapView.prototype, {
  drawTsp(ctx) {
    const { left, top, size } = this.sq;
    ctx.fillStyle = '#F7F2E6';
    ctx.fillRect(left, top, size, size);
    ctx.strokeStyle = '#8a7660';
    ctx.lineWidth = 2;
    ctx.strokeRect(left, top, size, size);
    const single = this.opts.showCandidates && this.agents.length === 1;
    const singleRun = single ? this.agents[0].run : null;
    if (single) this.drawTour(ctx, singleRun.state.best.pos, GOLD, 7, 0.4);
    if (this.showAnswer) this.drawTour(ctx, this.problem.ref.tour, GOLD, 2.5, 1, [7, 5]);
    const widths = [5.5, 3.5, 2];
    // A single route is drawn in neutral brown so the red / green edge change stands out.
    this.agents.forEach(({ run }, i) => this.drawTour(ctx, run.state.current.pos, single ? ROUTE_COLOR : ALGOS[run.algo].color,
      this.agents.length > 1 ? widths[i % widths.length] : 3, 0.8));
    if (this.userTour) this.drawTour(ctx, this.userTour, '#3d2f22', 3, 0.85);
    const detailTour = this.userTour || (singleRun && singleRun.state.current.pos);
    if (singleRun && singleRun.algo === 'ts') this.drawTabuEdges(ctx, singleRun.state.tabu);
    this.drawSelectedEdges(ctx);
    const change = this.explain ? null : this.edgeChange || this.recordEdgeChange();
    if (change) this.drawEdgeChange(ctx, change);
    if (this.explain) this.drawExplain(ctx, this.explain);
    // Labels go on top of the coloured edges so the numbers stay readable.
    // While the neighbour generator is open it draws its own arrows (the flipped piece points the other way).
    if (detailTour && !this.opts.compact) this.drawRouteDetails(ctx, detailTour, !this.explain);
    this.drawCrossings(ctx);
    this.drawCities(ctx, detailTour ? detailTour[0] : null);
    if (!this.opts.compact && !this.opts.square) this.drawBadges(ctx);
    if (single && this.opts.bubbles && !this.opts.square) this.drawBadgeNote(ctx, singleRun);
  },

  /** The edge change of the latest step for single-agent views (learn page, tune big view). */
  recordEdgeChange() {
    const rec = this.primaryRecord();
    if (!rec || rec.chosen === null) return null;
    const status = rec.event === 'stop' ? 'rejected' : rec.accepted ? 'accepted' : 'rejected';
    return { ...twoOptEdges(rec.chosen), status };
  },

  drawTour(ctx, tour, color, width, alpha, dash) {
    const pts = tour.map((k) => this.cityPx(this.problem.cities[k]));
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.lineJoin = 'round';
    if (dash) ctx.setLineDash(dash);
    ctx.beginPath();
    pts.forEach((q, i) => (i ? ctx.lineTo(q.x, q.y) : ctx.moveTo(q.x, q.y)));
    ctx.closePath();
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = 1;
  },

  /** Direction arrows and per-edge length labels, so "total length = sum of edges" is visible. */
  drawArrowHead(ctx, u, v, color, size) {
    const a = this.cityPx(this.problem.cities[u]);
    const b = this.cityPx(this.problem.cities[v]);
    ctx.save();
    ctx.translate(a.x + (b.x - a.x) * ARROW_AT, a.y + (b.y - a.y) * ARROW_AT);
    ctx.rotate(Math.atan2(b.y - a.y, b.x - a.x));
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(size, 0);
    ctx.lineTo(-size * 0.7, -size * 0.75);
    ctx.lineTo(-size * 0.7, size * 0.75);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  },

  drawRouteDetails(ctx, tour, withArrows = true) {
    const showLabels = tour.length <= EDGE_LABEL_MAX_CITIES;
    const placed = [];
    tour.forEach((u, k) => {
      const v = tour[(k + 1) % tour.length];
      const a = this.cityPx(this.problem.cities[u]);
      const b = this.cityPx(this.problem.cities[v]);
      if (withArrows) this.drawArrowHead(ctx, u, v, '#5b4a38', 6);
      if (!showLabels) return;
      ctx.font = '10px system-ui, sans-serif';
      ctx.textAlign = 'center';
      const label = fmt1(this.problem.dist[u][v]);
      const w = ctx.measureText(label).width + 6;
      const overlaps = (x, y) => placed.some((r) => Math.abs(r.x - x) < (r.w + w) / 2 && Math.abs(r.y - y) < 14);
      const t = LABEL_SLOTS.find((s) => !overlaps(a.x + (b.x - a.x) * s, a.y + (b.y - a.y) * s)) ?? 0.5;
      const mx = a.x + (b.x - a.x) * t;
      const my = a.y + (b.y - a.y) * t;
      placed.push({ x: mx, y: my, w });
      ctx.fillStyle = 'rgba(255,255,255,0.88)';
      ctx.beginPath();
      ctx.roundRect(mx - w / 2, my - 7, w, 13, 4);
      ctx.fill();
      ctx.fillStyle = '#5b4a38';
      ctx.fillText(label, mx, my + 3);
    });
  },

  drawSegment(ctx, u, v, color, width, dash) {
    const a = this.cityPx(this.problem.cities[u]);
    const b = this.cityPx(this.problem.cities[v]);
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.setLineDash(dash || []);
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();
    ctx.setLineDash([]);
    return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
  },

  /** Tabu search memory: edges cut recently may not be reconnected, drawn as thin orange dashes. */
  drawTabuEdges(ctx, tabu) {
    tabu.forEach((entry) => entry.keys.forEach((key) => {
      const [u, v] = key.split('-').map(Number);
      this.drawSegment(ctx, u, v, TABU_EDGE_COLOR, 2, [3, 4]);
    }));
  },

  /** change: { removed: [[u, v], ...], added: [[u, v], ...], status: 'accepted' | 'rejected' | 'preview' } */
  drawEdgeChange(ctx, change) {
    const rejected = change.status === 'rejected';
    ctx.font = '15px system-ui, sans-serif';
    ctx.textAlign = 'center';
    change.removed.forEach(([u, v]) => {
      const mid = this.drawSegment(ctx, u, v, REMOVED_COLOR, 3, [6, 5]);
      if (!this.opts.compact) {
        ctx.fillStyle = REMOVED_COLOR;
        ctx.fillText('✂', mid.x, mid.y + 5);
      }
    });
    ctx.globalAlpha = rejected ? 0.55 : 1;
    change.added.forEach(([u, v]) => {
      const mid = this.drawSegment(ctx, u, v, ADDED_COLOR, 4, rejected ? [4, 4] : null);
      if (rejected && !this.opts.compact) {
        ctx.fillStyle = REMOVED_COLOR;
        ctx.font = 'bold 15px system-ui, sans-serif';
        ctx.fillText('✗', mid.x, mid.y + 5);
      }
    });
    ctx.globalAlpha = 1;
  },

  /**
   * Neighbour generator stages: ① chosen edges in orange, ② cut (red) and the piece to flip in blue,
   * ③ the blue piece reversed (its arrows and the visiting-order badges flip), ④ the new edges in green.
   */
  drawExplain(ctx, { tour, move, stage }) {
    const { a, b, c, d, i, j } = move;
    const n = tour.length;
    const piece = tour.slice(i, j + 1);
    const order = stage >= 3 ? reverseSegment(tour, i, j) : tour;
    if (stage >= 2) {
      const pts = (stage >= 3 ? [...piece].reverse() : piece).map((k) => this.cityPx(this.problem.cities[k]));
      ctx.strokeStyle = 'rgba(59,130,246,0.45)';
      ctx.lineWidth = 12;
      ctx.lineJoin = 'round';
      ctx.beginPath();
      pts.forEach((q, k) => (k ? ctx.lineTo(q.x, q.y) : ctx.moveTo(q.x, q.y)));
      ctx.stroke();
    }
    if (stage === 1) [[a, b], [c, d]].forEach(([u, v]) => this.drawSegment(ctx, u, v, '#FF9F43', 8));
    else this.drawEdgeChange(ctx, { removed: [[a, b], [c, d]], added: stage === 4 ? [[a, c], [b, d]] : [], status: 'preview' });
    const cut = new Set([edgeKey(a, b), edgeKey(c, d)]);
    const added = new Set([edgeKey(a, c), edgeKey(b, d)]);
    order.forEach((u, k) => {
      const v = order[(k + 1) % n];
      const key = edgeKey(u, v);
      if (stage >= 2 && cut.has(key)) return;
      if (stage < 4 && added.has(key)) return;
      const inPiece = stage >= 2 && piece.includes(u) && piece.includes(v);
      this.drawArrowHead(ctx, u, v, inPiece ? '#1d4ed8' : '#5b4a38', inPiece ? 10 : 6);
    });
    this.drawOrderBadges(ctx, order, stage >= 3 ? piece : []);
    if (stage === 3) {
      const mid = this.cityPx(this.problem.cities[piece[Math.floor(piece.length / 2)]]);
      ctx.font = 'bold 14px system-ui, sans-serif';
      ctx.fillStyle = '#1d4ed8';
      ctx.textAlign = 'center';
      ctx.fillText('🔄 倒過來', mid.x, mid.y - 18);
    }
  },

  /** Visiting order (🏠 = 1) next to every city; badges of the flipped piece are blue. */
  drawOrderBadges(ctx, order, highlight) {
    ctx.font = 'bold 10px system-ui, sans-serif';
    ctx.textAlign = 'center';
    order.forEach((city, k) => {
      const q = this.cityPx(this.problem.cities[city]);
      const blue = highlight.includes(city);
      ctx.fillStyle = blue ? '#1d4ed8' : '#3d2f22';
      ctx.beginPath();
      ctx.arc(q.x + 12, q.y + 11, 7, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.fillText(String(k + 1), q.x + 12, q.y + 14.5);
    });
  },

  drawSelectedEdges(ctx) {
    const tour = this.userTour;
    if (!tour) return;
    this.selectedEdges.forEach((k) => {
      const [u, v] = tourEdge(tour, k);
      this.drawSegment(ctx, u, v, '#FF9F43', 7);
    });
  },

  drawCrossings(ctx) {
    if (!this.crossings) return;
    ctx.strokeStyle = 'rgba(220,38,38,0.75)';
    ctx.lineWidth = 1.5;
    this.crossings.forEach((pt) => {
      const q = this.cityPx(pt);
      ctx.beginPath();
      ctx.arc(q.x, q.y, 6, 0, Math.PI * 2);
      ctx.stroke();
    });
  },

  drawCities(ctx, home) {
    ctx.textAlign = 'center';
    this.problem.cities.forEach((c, k) => {
      const q = this.cityPx(c);
      const isHome = k === home;
      ctx.beginPath();
      ctx.arc(q.x, q.y, isHome ? 9 : 7, 0, Math.PI * 2);
      ctx.fillStyle = isHome ? '#FFE3B3' : '#fff';
      ctx.fill();
      ctx.strokeStyle = '#3d2f22';
      ctx.lineWidth = isHome ? 2.5 : 1.5;
      ctx.stroke();
      ctx.fillStyle = '#3d2f22';
      ctx.font = 'bold 9px system-ui, sans-serif';
      ctx.fillText(String(k), q.x, q.y + 3);
      if (isHome && !this.opts.compact) {
        ctx.font = '15px system-ui, sans-serif';
        ctx.fillText('🏠', q.x, q.y - 12);
      }
    });
  },

  drawBadges(ctx) {
    ctx.textAlign = 'left';
    this.agents.forEach(({ run }, i) => {
      const y = 14 + i * 60;
      const img = agentImage(ALGOS[run.algo].icon);
      if (img.complete && img.naturalWidth) ctx.drawImage(img, 8, y, 36, 36);
      ctx.fillStyle = '#fff';
      ctx.strokeStyle = ALGOS[run.algo].color;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.roundRect(46, y + 6, 58, 24, 8);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#3d2f22';
      ctx.font = 'bold 12px system-ui, sans-serif';
      ctx.fillText(fmt1(run.state.current.display), 52, y + 22);
      if (run.state.stopped) ctx.fillText('💤', 8, y + 46);
    });
  },

  /** Short step note in the left margin (not over the map), wrapped to the margin width. */
  drawBadgeNote(ctx, run) {
    const rec = lastRecord(run);
    if (!rec) return;
    const maxW = 92;
    ctx.font = 'bold 12px system-ui, sans-serif';
    const lines = [];
    let line = '';
    [...shortNarration(run, rec)].forEach((ch) => {
      if (ctx.measureText(line + ch).width > maxW) {
        lines.push(line);
        line = ch;
      } else line += ch;
    });
    if (line) lines.push(line);
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = ALGOS[run.algo].color;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(6, 66, maxW + 10, lines.length * 16 + 10, 10);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = '#3d2f22';
    ctx.textAlign = 'left';
    lines.forEach((l, i) => ctx.fillText(l, 11, 66 + 18 + i * 16));
  },
});

// ===== chart-view.js =====
// ---------- Progress chart (spec 4.8) ----------
const CHART_W = 600;
const CHART_H = 220;
const CHART_PAD = Object.freeze({ left: 46, right: 14, top: 40, bottom: 30 });

class ChartView {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.runs = [];
    this.options = {};
    this.hoverX = null;
    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      this.hoverX = ((e.clientX - rect.left) / rect.width) * CHART_W;
      this.draw();
    });
    canvas.addEventListener('mouseleave', () => {
      this.hoverX = null;
      this.draw();
    });
    window.addEventListener('resize', () => this.draw());
  }

  /** options: { styles: [{ color, name }] per run, target: { value, label }, hideCurrent } */
  setRuns(runs, options = {}) {
    this.runs = runs;
    this.options = options;
    this.draw();
  }

  series(run, i) {
    const first = run.records.length ? run.records[0].from.display : run.state.current.display;
    const style = (this.options.styles || [])[i];
    return {
      color: style ? style.color : ALGOS[run.algo].color,
      name: style ? style.name : ALGOS[run.algo].animal,
      stopped: Boolean(run.state.stopped),
      current: [first, ...run.records.map((r) => r.to.display)],
      best: [first, ...run.records.map((r) => r.best.display)],
    };
  }

  draw() {
    const w = this.canvas.clientWidth;
    if (!w) return;
    if (!this.runs.length) {
      this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
      return;
    }
    const dpr = window.devicePixelRatio || 1;
    this.canvas.width = Math.round(w * dpr);
    this.canvas.height = Math.round(((w * CHART_H) / CHART_W) * dpr);
    const ctx = this.ctx;
    ctx.setTransform(this.canvas.width / CHART_W, 0, 0, this.canvas.width / CHART_W, 0, 0);
    ctx.clearRect(0, 0, CHART_W, CHART_H);
    const lowerIsBetter = this.runs[0].problem.type === 'tsp';
    const data = this.runs.map((r, i) => this.series(r, i));
    const { target, hideCurrent } = this.options;
    const maxStep = Math.max(10, ...data.map((s) => s.current.length - 1));
    const all = [...data.flatMap((s) => s.current), ...(target ? [target.value] : [])];
    const yMin = lowerIsBetter ? Math.min(...all) * 0.95 : 0;
    const yMax = lowerIsBetter ? Math.max(...all) * 1.02 : HEIGHT_MAX;
    const sx = (i) => CHART_PAD.left + (i / maxStep) * (CHART_W - CHART_PAD.left - CHART_PAD.right);
    const sy = (v) => CHART_H - CHART_PAD.bottom - ((v - yMin) / (yMax - yMin || 1)) * (CHART_H - CHART_PAD.top - CHART_PAD.bottom);
    this.drawAxes(ctx, { maxStep, yMin, yMax, sx, sy, lowerIsBetter });
    if (target) this.drawTarget(ctx, target, sx, sy, maxStep);
    data.forEach((s) => {
      if (!hideCurrent) this.line(ctx, s.current, sx, sy, s.color, 1.2, [4, 3], 0.55);
      this.line(ctx, s.best, sx, sy, s.color, 2.5, null, 1);
      const last = s.best.length - 1;
      if (s.stopped && last < maxStep) {
        // A stopped run keeps its best value: continue it as a faint solid line ending in 💤.
        ctx.globalAlpha = 0.3;
        ctx.strokeStyle = s.color;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(sx(last), sy(s.best[last]));
        ctx.lineTo(sx(maxStep), sy(s.best[last]));
        ctx.stroke();
        ctx.globalAlpha = 1;
        ctx.font = '12px system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('💤', sx(last), sy(s.best[last]) - 6);
      }
    });
    this.drawLegend(ctx, data);
    this.drawHover(ctx, data, { maxStep, sx });
  }

  drawAxes(ctx, { maxStep, yMin, yMax, sx, sy, lowerIsBetter }) {
    ctx.strokeStyle = 'rgba(80,60,40,0.15)';
    ctx.fillStyle = '#7a6a58';
    ctx.font = '11px system-ui, sans-serif';
    ctx.lineWidth = 1;
    for (let k = 0; k <= 4; k++) {
      const v = yMin + ((yMax - yMin) * k) / 4;
      ctx.beginPath();
      ctx.moveTo(CHART_PAD.left, sy(v));
      ctx.lineTo(CHART_W - CHART_PAD.right, sy(v));
      ctx.stroke();
      ctx.textAlign = 'right';
      ctx.fillText(String(Math.round(v)), CHART_PAD.left - 6, sy(v) + 4);
    }
    ctx.textAlign = 'center';
    for (let k = 0; k <= 5; k++) {
      const i = Math.round((maxStep * k) / 5);
      ctx.fillText(String(i), sx(i), CHART_H - 10);
    }
    ctx.textAlign = 'left';
    ctx.fillText(lowerIsBetter ? '路線長度（越低越好）' : '高度（越高越好）', CHART_PAD.left, 13);
    ctx.textAlign = 'right';
    ctx.fillText('步數 →　實線＝歷史最佳　虛線＝目前值　淡線＋💤＝已停止', CHART_W - CHART_PAD.right, 13);
  }

  drawLegend(ctx, data) {
    ctx.font = '12px system-ui, sans-serif';
    ctx.textAlign = 'left';
    let x = CHART_PAD.left;
    data.forEach((s) => {
      ctx.fillStyle = s.color;
      ctx.fillRect(x, 26, 16, 4);
      ctx.fillStyle = '#3d2f22';
      ctx.fillText(s.name, x + 20, 31);
      x += ctx.measureText(s.name).width + 36;
    });
  }

  drawTarget(ctx, target, sx, sy, maxStep) {
    ctx.setLineDash([6, 4]);
    ctx.strokeStyle = '#b8860b';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(sx(0), sy(target.value));
    ctx.lineTo(sx(maxStep), sy(target.value));
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#b8860b';
    ctx.font = '11px system-ui, sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText(target.label, sx(maxStep), sy(target.value) - 4);
  }

  line(ctx, values, sx, sy, color, width, dash, alpha) {
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    if (dash) ctx.setLineDash(dash);
    ctx.beginPath();
    values.forEach((v, i) => (i ? ctx.lineTo(sx(i), sy(v)) : ctx.moveTo(sx(i), sy(v))));
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = 1;
  }

  drawHover(ctx, data, { maxStep, sx }) {
    if (this.hoverX === null || this.hoverX < CHART_PAD.left) return;
    const step = clamp(Math.round(((this.hoverX - CHART_PAD.left) / (CHART_W - CHART_PAD.left - CHART_PAD.right)) * maxStep), 0, maxStep);
    ctx.strokeStyle = 'rgba(61,47,34,0.4)';
    ctx.beginPath();
    ctx.moveTo(sx(step), CHART_PAD.top);
    ctx.lineTo(sx(step), CHART_H - CHART_PAD.bottom);
    ctx.stroke();
    const rows = data.filter((s) => step < s.best.length)
      .map((s) => ({ color: s.color, text: `${s.name} 目前 ${fmt1(s.current[step])}／最佳 ${fmt1(s.best[step])}` }));
    const lines = [{ color: '#fff', text: `第 ${step} 步` }, ...rows];
    ctx.font = '12px system-ui, sans-serif';
    const w = Math.max(...lines.map((l) => ctx.measureText(l.text).width)) + 16;
    const bx = sx(step) + 10 + w > CHART_W ? sx(step) - w - 10 : sx(step) + 10;
    ctx.fillStyle = 'rgba(61,47,34,0.9)';
    ctx.fillRect(bx, CHART_PAD.top, w, lines.length * 17 + 6);
    lines.forEach((l, i) => {
      ctx.fillStyle = i === 0 ? '#fff' : l.color;
      ctx.textAlign = 'left';
      ctx.fillText(l.text, bx + 8, CHART_PAD.top + 16 + i * 17);
    });
  }
}

// ===== components.js =====
// ---------- Shared components (spec 4.1, 4.3 - 4.7) ----------

/** F-10 ~ F-13: problem type, map, seed and random-count picker. */
function createProblemPicker({ initial, onChange }) {
  let config = { ...initial };
  const mapSelect = h('select', { class: 'select', 'aria-label': '地圖', onChange: (e) => update({ mapId: e.target.value }) });
  const seedInput = h('input', { type: 'text', inputmode: 'numeric', class: 'input seed-input', 'aria-label': '種子碼', value: String(config.seed) });
  const seedError = h('div', { class: 'field-error', role: 'alert' });
  const countValue = h('output', { class: 'param-value' });
  const countInput = h('input', { type: 'range', class: 'range', 'aria-label': '數量' });
  const countLabel = h('span', { class: 'param-label' });
  const countRow = h('div', { class: 'param-row' }, countLabel, countInput, countValue);

/** Timing loop for auto-play (F-50, F-53). tick() returns false when there is nothing left to run. */
function createPlayer({ tick, onChange }) {
  let timer = null;
  let speed = 5;
  const loop = () => {
    if (!tick()) {
      stop();
      return;
    }
    timer = setTimeout(loop, 1000 / speed);
  };
  function stop() {
    clearTimeout(timer);
    timer = null;
    onChange(false);
  }
  return {
    get playing() { return timer !== null; },
    setSpeed(value) { speed = value; },
    play() {
      if (timer !== null) return;
      timer = setTimeout(loop, 0);
      onChange(true);
    },
    pause() { if (timer !== null) stop(); },
    toggle() { if (timer !== null) stop(); else this.play(); },
  };
}

function thermometer(run) {

  const hue = Math.round(220 * (1 - frac));
  return h('div', { class: 'thermo' },
    h('span', { class: 'thermo-icon' }, frac > 0.5 ? '🔥' : '❄️'),
    h('div', { class: 'thermo-track' },
      h('div', { class: 'thermo-fill', style: `width:${Math.round(frac * 100)}%;background:hsl(${hue},80%,55%)` })),
    h('span', { class: 'thermo-value' }, `T = ${fmt1(T)}`));
}

// ===== code-trace.js =====
// ---------- Pseudocode execution trace (spec v1.2, item 2) ----------
// For one step record, lists the pseudocode lines actually executed, in order, with the values at that moment.

function compareText(type, a, b) {
  return type === 'tsp' ? `長度 ${fmt1(a)} < ${fmt1(b)}` : `${fmt1(a)} > ${fmt1(b)}`;
}

function chosenDisplayOf(record) {
  const hit = record.candidates.find((c) => c.move === record.chosen);
  return hit ? hit.display : record.to.display;
}

function bestCandidateDisplay(type, record) {
  const values = record.candidates.map((c) => c.display);
  return type === 'tsp' ? Math.min(...values) : Math.max(...values);
}

function traceHill(run, record) {
  const { problem, ops } = run;
  const type = problem.type;
  const best = record.chosen === null ? bestCandidateDisplay(type, record) : chosenDisplayOf(record);
  const label = record.chosen === null ? '' : ops.moveLabel(problem, record.from.pos, record.chosen);
  const steps = [
    { line: 3, note: `找到 ${record.candidates.length} ${type === 'tsp' ? '種改法' : '個鄰居'}` },
    { line: 4, note: `${label || '最好的鄰居'}：${ops.valueName} ${fmt1(best)}` },
  ];
  if (record.event === 'move') {
    return [...steps,
      { line: 5, note: `${compareText(type, best, record.from.display)} ✓` },
      { line: 6, note: `走到 ${label}` }];
  }
  return [...steps,
    { line: 5, note: `${compareText(type, best, record.from.display)} ✗` },
    { line: 7, note: '條件不成立，進入 else' },
    { line: 8, note: ops.isGlobal(problem, record.best.display) ? '停止（這裡剛好就是全域最佳）' : '停止：卡在局部最佳' }];
}

function traceAnneal(run, record) {
  const { problem, ops, params } = run;
  const T = record.temperature;
  const label = ops.moveLabel(problem, record.from.pos, record.chosen);
  const steps = [
    { line: 2, note: `T=${fmt1(T)} > ${params.tMin} ✓，第 ${record.step} 步` },
    { line: 3, note: `隨機挑到 ${label}` },
    { line: 4, note: `Δ = ${fmt1(record.delta)}` },
  ];
  const cool = { line: 8, note: `T = ${fmt1(T)} × ${params.alpha} = ${fmt1(T * params.alpha)}` };
  if (record.event === 'better') return [...steps, { line: 5, note: 'Δ > 0 ✓ 接受' }, cool];
  const [r, p] = fmtProbPair(record.rand, record.prob);
  const decide = { line: 5, note: 'Δ > 0 ✗' };
  if (record.accepted) return [...steps, decide, { line: 6, note: `rand=${r} < e^(Δ/T)=${p} ✓ 接受` }, cool];
  return [...steps, decide, { line: 6, note: `rand=${r} < e^(Δ/T)=${p} ✗` }, { line: 7, note: '拒絕，留在原地' }, cool];
}

function traceTabu(run, record) {
  const { problem, ops, params } = run;
  const k = record.candidates.length;
  const allowed = record.candidates.filter((c) => !c.tabu).length;
  const steps = [
    { line: 2, note: `已走 ${record.step - 1} 步 < ${params.maxSteps} ✓` },
    { line: 3, note: `${k} 個鄰居` },
    { line: 4, note: `${allowed} 個非禁忌${record.aspiration ? '＋1 個特赦' : ''}` },
  ];
  if (record.event === 'stop') return [...steps, { line: 5, note: 'allowed 是空的 → 停止' }];
  const label = ops.moveLabel(problem, record.from.pos, record.chosen);
  const value = chosenDisplayOf(record);
  // One entry is added per step, so once the step count passes L the oldest entry is dropped.
  const trimmed = record.step > params.tenure;
  return [...steps,
    { line: 6, note: `${label}：${ops.valueName} ${fmt1(value)}` },
    { line: 7, note: `走過去，記入禁忌表` },
    { line: 8, note: trimmed ? `超過 L=${params.tenure}，移除最舊的一筆` : `禁忌表 ${record.tabu.length}/${params.tenure}` },
    { line: 9, note: record.isNewBest ? `${fmt1(value)} 打破紀錄 ✓` : `沒有打破紀錄 ${fmt1(record.prevBest.display)}` }];
}

const TRACE_FNS = Object.freeze({ hc: traceHill, sa: traceAnneal, ts: traceTabu });

/** [{ line, note }] in execution order. The decisive lines are record.lines (highlighted strongest). */
function codeTrace(run, record) {
  return TRACE_FNS[run.algo](run, record);
}

// ===== narration-ui.js =====
// ---------- Step explanation panels (spec v1.2, items 1 - 3) ----------
const MAX_HISTORY = 30;
const MAG_RINGS = 2;

/** "This step" card right under the canvas, with the optional pseudocode execution trace. */
function createStepCard() {
  const title = h('h3', { class: 'panel-title' });
  const how = h('p', { class: 'how-line' });
  const body = h('div', { class: 'step-body', 'aria-live': 'polite' });
  const stuck = h('div', { class: 'stuck', hidden: true });
  const code = h('ol', { class: 'pseudo', hidden: true });
  const toggle = h('input', { type: 'checkbox' });
  toggle.addEventListener('change', () => { code.hidden = !toggle.checked; });
  let algo = null;
  let type = '2d';

  function renderCode(trace, decisive) {
    const order = new Map(trace.map((t, i) => [t.line, i]));
    code.replaceChildren(...pseudocodeFor(algo, type).map((text, idx) => {
      const line = idx + 1;
      const hit = trace.find((t) => t.line === line);
      const cls = [hit ? 'ran' : '', decisive.includes(line) ? 'hl' : ''].join(' ').trim();
      return h('li', { class: cls, style: hit ? `--d:${order.get(line)}` : null },
        h('code', null, text), hit ? h('span', { class: 'trace-note' }, hit.note) : null);
    }));
  }

  return {
    el: h('section', { class: 'panel step-card' },
      h('div', { class: 'panel-head' }, title, h('label', { class: 'toggle' }, toggle, ' 顯示程式執行過程')),
      how, stuck, body, code),
    setAlgo(next, problem) {
      algo = next;
      type = problem.type;
      how.textContent = algoHowText(algo, problem);
      renderCode([], []);
    },
    reset(intro) {
      title.textContent = '準備開始';
      body.innerHTML = intro;
      stuck.hidden = true;
      renderCode([], []);
    },
    show(run, record) {
      title.textContent = `第 ${record.step} 步`;
      body.innerHTML = narrate(run, record).join('<br>');
      renderCode(codeTrace(run, record), record.lines);
    },
    showStuck(onSwitch) {
      stuck.replaceChildren(
        h('p', null, '🐐 山羊卡住了！這裡是局部最高點，但不是全域最高。試試看小龍或狐狸？'),
        h('div', { class: 'row' },
          h('button', { type: 'button', class: 'btn btn-small', onClick: () => onSwitch('sa') }, agentImg('sa', 20), ' 換小龍'),
          h('button', { type: 'button', class: 'btn btn-small', onClick: () => onSwitch('ts') }, agentImg('ts', 20), ' 換狐狸')));
      stuck.hidden = false;
    },
  };
}

/** Older narration entries, newest first. */
function createHistoryPanel() {
  const list = h('ol', { class: 'narration-list' });
  return {
    el: h('section', { class: 'panel' }, h('h3', { class: 'panel-title' }, '歷史紀錄'), list),
    clear() { list.replaceChildren(h('li', { class: 'intro' }, '每一步的說明會留在這裡。')); },
    add(step, lines) {
      if (list.firstElementChild && list.firstElementChild.classList.contains('intro')) list.replaceChildren();
      list.prepend(h('li', null, h('span', { class: 'step-tag' }, `#${step}`), h('div', { html: lines.join('<br>') })));
      while (list.children.length > MAX_HISTORY) list.lastElementChild.remove();
    },
  };
}

function magnifierCell(run, record, center, dx, dy, step) {
  const pos = point2d(center.x + dx * step, center.y + dy * step);
  const inside = pos.x >= 0 && pos.y >= 0 && pos.x < SIZE_2D && pos.y < SIZE_2D;
  if (!inside) return h('div', { class: 'mag-cell out' }, '邊界');
  const value = run.ops.display(run.problem, pos);
  const style = `background:${terrainCss(value)};color:${terrainInk(value)}`;
  if (dx === 0 && dy === 0) {
    return h('div', { class: 'mag-cell center', style }, agentImg(run.algo, 26), h('span', null, fmt1(value)));
  }
  const isInner = Math.max(Math.abs(dx), Math.abs(dy)) === 1;
  const cand = record && isInner ? record.candidates.find((c) => c.move.x === pos.x && c.move.y === pos.y) : null;
  const chosen = cand && record.chosen === cand.move && record.accepted;
  const cls = ['mag-cell',
    isInner ? 'inner' : 'outer',
    cand ? (cand.tabu ? 'tabu' : cand.better ? 'better' : 'worse') : (record && isInner ? 'unchecked' : ''),
    chosen ? 'chosen' : ''].join(' ');
  const tag = !cand ? null : cand.tabu ? h('i', { class: 'mag-tag tabu' }, '✕')
    : h('i', { class: `mag-tag ${cand.better ? 'up' : 'down'}` }, cand.better ? '▲' : '▼');
  return h('div', { class: cls, style }, tag, h('span', null, fmt1(value)), chosen ? h('i', { class: 'mag-pick' }, '選中') : null);
}

/** 2D zoom panel centred on where this step's decision was made. */
function createMagnifier() {
  const title = h('h3', { class: 'panel-title' });
  const grid = h('div', { class: 'mag-grid' });
  const note = h('p', { class: 'mag-note' });
  const el = h('section', { class: 'panel magnifier' }, title, grid, note,
    h('p', { class: 'mag-legend' }, h('span', { class: 'lg better' }, '比現在高'), h('span', { class: 'lg worse' }, '比現在低'),
      h('span', { class: 'lg chosen' }, '選中'), h('span', { class: 'lg tabu' }, '禁忌')));
  return {
    el,
    update(run, record) {
      el.hidden = run.problem.type !== '2d';
      if (el.hidden) return;
      const step = stepSizeFor('2d', run.params);
      const center = record ? record.from.pos : run.state.current.pos;
      const cells = [];
      for (let dy = -MAG_RINGS; dy <= MAG_RINGS; dy++) {
        for (let dx = -MAG_RINGS; dx <= MAG_RINGS; dx++) cells.push(magnifierCell(run, record, center, dx, dy, step));
      }
      grid.replaceChildren(...cells);
      title.textContent = record ? `🔍 第 ${record.step} 步的決策` : '🔍 放大鏡';
      const who = ALGOS[run.algo].animal;
      const how = run.algo === 'sa' ? `${who}這一步只隨機檢查 1 個鄰居（淡色＝沒檢查）。` : `${who}檢查了周圍 8 個鄰居。`;
      note.textContent = `以${who}${record ? '出發點' : '目前位置'}為中心，每格相隔 ${step}。${record ? how : ''}`;
    },
  };
}

// ===== step-detail.js =====
// ---------- Step explanation panels for every problem type (TSP: spec v1.3; 1D / 2D parity: spec v1.5) ----------
const RANKING_TOP = 5;
const RANKING_SHOW_ALL = 9;

/** City order as chips, starting at the home city 🏠; [i..j] gets segClass (the reversed part). */
function cityChips(tour, i, j, segClass) {
  const chips = tour.flatMap((city, k) => [
    h('span', { class: `city-chip ${k === 0 ? 'start' : ''} ${k >= i && k <= j ? segClass : ''}` }, k === 0 ? `🏠${city}` : String(city)),
    h('span', { class: 'arrow' }, '→')]);
  return h('div', { class: 'chips-row' }, chips, h('span', { class: 'city-chip home' }, `🏠${tour[0]}`));
}

/** "−ab −cd +ac +bd = change" for a 2-opt move; lengthChange is new length minus old length. */
function edgeFormula(problem, move, lengthChange) {
  const D = problem.dist;
  const { a, b, c, d } = move;
  const term = (sign, u, v, cls) => h('span', { class: cls }, `${sign}${fmt1(D[u][v])}（${u}–${v}）`);
  return h('p', { class: 'formula' }, '長度變化 = ',
    term('−', a, b, 'rm'), ' ', term('−', c, d, 'rm'), ' ', term('+', a, c, 'add'), ' ', term('+', b, d, 'add'),
    ` = ${lengthChange > 0 ? '+' : lengthChange < 0 ? '−' : ''}${fmt1(Math.abs(lengthChange))}`,
    h('b', null, lengthChange < 0 ? '（變短）' : lengthChange > 0 ? '（變長）' : '（不變）'));
}

/** How far the current solution is from the best one (route length or height). */
function gapBar(run) {
  const cur = run.state.current.display;
  if (run.problem.type === 'tsp') {
    const ref = run.problem.ref.length;
    const extra = (cur / ref - 1) * 100;
    return h('div', { class: 'gap' },
      h('div', { class: 'gap-text' }, `目前長度 ${fmt1(cur)}　｜　參考最佳 ${fmt1(ref)}　｜　`,
        h('b', null, extra < 0.05 ? '已經是最佳！' : `還多 ${extra.toFixed(0)}%`)),
      h('div', { class: 'gap-track' }, h('div', { class: 'gap-fill', style: `width:${Math.min(100, (ref / cur) * 100).toFixed(1)}%` })));
  }
  const top = run.problem.global.value;
  const short = top - cur;
  return h('div', { class: 'gap' },
    h('div', { class: 'gap-text' }, `目前高度 ${fmt1(cur)}　｜　全域最高 ${fmt1(top)}　｜　`,
      h('b', null, short < 0.05 ? '已經在最高點！' : `還差 ${fmt1(short)}`)),
    h('div', { class: 'gap-track' }, h('div', { class: 'gap-fill', style: `width:${Math.min(100, (cur / top) * 100).toFixed(1)}%` })));
}

function candidateLabel(run, record, cand) {
  if (run.problem.type === 'tsp') return run.ops.moveLabel(run.problem, record.from.pos, cand.move);
  const dir = moveDirection(run.problem.type, record.from.pos, cand.move);
  return `${dir ? `往${dir} ` : ''}${run.ops.moveLabel(run.problem, record.from.pos, cand.move)}`;
}

function pickTag(run, record) {
  const isTsp = run.problem.type === 'tsp';
  if (record.accepted) return isTsp ? '✓ 選這個' : '✓ 走這裡';
  if (record.event === 'stop') return isTsp ? '最好的也沒變短' : '最高的也沒比現在高';
  return '✗ 拒絕';
}

function rankingRow(run, record, cand, rank) {
  const isTsp = run.problem.type === 'tsp';
  const change = cand.display - record.from.display;
  const better = run.ops.isBetter(cand.display, record.from.display);
  const chosen = cand.move === record.chosen;
  const sign = Math.abs(change) < 0.05 ? '±' : change > 0 ? '+' : '−';
  const valueText = isTsp ? `${sign}${fmt1(Math.abs(change))}` : `${fmt1(cand.display)}（${sign}${fmt1(Math.abs(change))}）`;
  return h('li', { class: `rank-row ${cand.tabu ? 'tabu' : ''} ${chosen ? 'chosen' : ''}` },
    h('span', { class: 'rank-no' }, `#${rank}`),
    h('span', { class: 'rank-move' }, candidateLabel(run, record, cand)),
    h('span', { class: better ? 'good' : 'bad' }, `${sign === '±' ? '＝' : better ? '▲' : '▼'} ${valueText}`),
    cand.tabu ? h('span', { class: 'tag tabu' }, '🚫 禁忌') : null,
    chosen ? h('span', { class: 'tag pick' }, pickTag(run, record)) : null);
}

/** Every neighbour tried this step, best first: makes "the goat checks all of them" visible. */
function neighbourRanking(run, record) {
  const isTsp = run.problem.type === 'tsp';
  const total = neighbourCount(run.problem);
  const unit = isTsp ? '種改法' : '個鄰居';
  if (!record) {
    return h('p', { class: 'muted' }, isTsp ? `這張圖每一步共有 ${total} 種 2-opt 改法可以試（每一種都是一條「鄰居路線」）。`
      : `每一步最多有 ${total} 個鄰居可以看。按「⏭ 下一步」後，這裡會列出這一步比較過的鄰居。`);
  }
  if (run.algo === 'sa') {
    return h('div', null, h('p', { class: 'rank-title' }, `小龍這一步只從 ${total} ${unit}裡隨機抽 1 ${isTsp ? '種' : '個'}：`),
      h('ol', { class: 'ranking' }, rankingRow(run, record, record.candidates[0], '?')));
  }
  const better = run.ops.isBetter;
  const sorted = [...record.candidates].sort((a, b) => (better(a.display, b.display) ? -1 : better(b.display, a.display) ? 1 : 0));
  const improving = sorted.filter((c) => better(c.display, record.from.display)).length;
  const tabu = sorted.filter((c) => c.tabu).length;
  const rows = sorted.map((c, k) => rankingRow(run, record, c, k + 1));
  const head = h('p', { class: 'rank-title' },
    `${ALGOS[run.algo].animal}比較了全部 ${record.candidates.length} ${unit}：${improving} ${isTsp ? '種會變短' : '個比現在高'}${tabu ? `，${tabu} 個是禁忌` : ''}。`);
  if (rows.length <= RANKING_SHOW_ALL) return h('div', null, head, h('ol', { class: 'ranking' }, rows));
  const chosenRow = rows.findIndex((r) => r.classList.contains('chosen'));
  const extra = chosenRow >= RANKING_TOP ? [h('li', { class: 'rank-gap' }, '⋯'), rows[chosenRow]] : [];
  return h('div', null, head, h('ol', { class: 'ranking' }, rows.slice(0, RANKING_TOP), extra),
    h('details', { class: 'rank-all' }, h('summary', null, `看全部 ${rows.length} ${unit}`),
      h('ol', { class: 'ranking' }, sorted.map((c, k) => rankingRow(run, record, c, k + 1)))));
}

function legendItem(cls, text) {
  return h('span', { class: 'lg-item' }, h('i', { class: `lg-line ${cls}` }), text);
}

function mapLegend(type) {
  const rows = type === 'tsp'
    ? [legendItem('route', '目前路線'), legendItem('best', '歷史最佳路線'), legendItem('cut', '✂ 這一步拆掉'), legendItem('add', '這一步接上'),
      legendItem('reject', '✗ 被拒絕的提案'), legendItem('tabu', '不准接回（禁忌）'),
      h('span', { class: 'lg-item' }, '🏠 起點　▶ 行進方向　數字＝這一段的長度')]
    : [legendItem('trail', '走過的路線'), h('span', { class: 'lg-item' }, h('i', { class: 'lg-box up' }), '比現在高的鄰居'),
      h('span', { class: 'lg-item' }, h('i', { class: 'lg-box down' }), '比現在低的鄰居'), legendItem('aim', '這一步要走的方向'),
      h('span', { class: 'lg-item' }, h('i', { class: 'lg-box tabu' }), '✕ 禁忌（狐狸不能回去）'),
      h('span', { class: 'lg-item' }, '⭐ 全域最高（勾「顯示答案」）　💤 停下來了　💬 這一步的一句話')];
  return h('details', { class: 'tsp-legend', open: true }, h('summary', null, '圖例'), h('div', { class: 'lg-row' }, rows));
}

function sequenceRows(run, record) {
  if (!record || record.chosen === null) {
    return [h('div', { class: 'seq' }, h('span', { class: 'seq-label' }, '目前路線'), cityChips(run.state.current.pos, -1, -1, ''))];
  }
  const { i, j } = record.chosen;
  const before = record.from.pos;
  const label = record.event === 'stop' ? '最好的改法（也會變長，所以不改）' : record.accepted ? '改之後' : '提案（被拒絕）';
  return [
    h('div', { class: 'seq' }, h('span', { class: 'seq-label' }, '改之前'), cityChips(before, i, j, 'seg-old')),
    h('div', { class: 'seq' }, h('span', { class: 'seq-label' }, label), cityChips(reverseSegment(before, i, j), i, j, 'seg-new')),
    edgeFormula(run.problem, record.chosen, -record.delta),
  ];
}

/**
 * topEl: gap bar + legend right under the canvas (all problem types).
 * el: what this step compared (TSP adds the city order and length formula), under the step card.
 */
function createStepDetail() {
  const top = h('div', { class: 'tsp-top' });
  const title = h('h3', { class: 'panel-title' });
  const body = h('div', { class: 'tsp-body' });
  const el = h('section', { class: 'panel tsp-detail' }, title, body);
  return {
    el,
    topEl: top,
    update(run, record) {
      const isTsp = run.problem.type === 'tsp';
      title.textContent = isTsp ? '🧭 這一步的 2-opt' : '🧭 這一步比較了哪些鄰居';
      top.replaceChildren(gapBar(run), mapLegend(run.problem.type));
      body.replaceChildren(...(isTsp ? sequenceRows(run, record) : []), neighbourRanking(run, record));
    },
  };
}

/**
 * TSP demos on one six-city map, shown frame by frame. Found by search so the goat stops at a route that is not the
 * shortest (231), while the dragon (after accepting a longer route) and the fox (after a slightly longer move) reach 215.
 * New edges are green when the route got shorter and red when it got longer.
 * All three loops have four frames, so they stay in step and end side by side (231 vs 215).
 */
const TSP_DEMO_CITIES = Object.freeze([[44, 64], [154, 36], [182, 116], [141, 91], [100, 111], [224, 49]]);
const TSP_FRAME_SEC = 2;
const TSP_DEMO_TOURS = Object.freeze({
  start: [0, 3, 1, 2, 5, 4],
  stuck: [0, 3, 1, 5, 2, 4],
  detour: [0, 3, 2, 5, 1, 4],
  best: [0, 1, 5, 2, 3, 4],
  hot: [0, 3, 4, 5, 2, 1],
  cooling: [0, 4, 3, 5, 2, 1],
});

const demoTourLength = (tour) => Math.round(tour.reduce((sum, c, k) => {
  const [x1, y1] = TSP_DEMO_CITIES[c];
  const [x2, y2] = TSP_DEMO_CITIES[tour[(k + 1) % tour.length]];
  return sum + Math.hypot(x2 - x1, y2 - y1);
}, 0) / 2);

const tourEdges = (tour) => tour.map((c, k) => [c, tour[(k + 1) % tour.length]]);
const sameEdge = ([a, b], [c, d]) => (a === c && b === d) || (a === d && b === c);

/** Opacity animation that shows frame k of n, one equal slot each. */
function frameAnim(k, n) {
  const times = Array.from({ length: n + 1 }, (_, i) => +(i / n).toFixed(4));
  const values = times.map((_, i) => (Math.min(i, n - 1) === k ? 1 : 0));
  return `<animate attributeName="opacity" dur="${n * TSP_FRAME_SEC}s" repeatCount="indefinite" calcMode="discrete" keyTimes="${times.join(';')}" values="${values.join(';')}"/>`;
}

function tspFrame(frame, prev, k, n) {
  const length = demoTourLength(frame.tour);
  const change = prev ? Math.sign(length - demoTourLength(prev.tour)) : 0;
  const newColor = change < 0 ? '#16a34a' : '#dc2626';
  const lenColor = change < 0 ? '#16a34a' : change > 0 ? '#dc2626' : '#3d2f22';
  const line = ([a, b], color, width) => {
    const [x1, y1] = TSP_DEMO_CITIES[a];
    const [x2, y2] = TSP_DEMO_CITIES[b];
    return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="${width}" stroke-linecap="round"/>`;
  };
  const edges = tourEdges(frame.tour);
  const isNew = (e) => prev && !tourEdges(prev.tour).some((old) => sameEdge(old, e));
  return `<g opacity="${k === 0 ? 1 : 0}">${edges.filter((e) => !isNew(e)).map((e) => line(e, '#7a6a58', 3)).join('')}
  ${edges.filter(isNew).map((e) => line(e, newColor, 5)).join('')}
  <text x="254" y="16" font-size="13" font-weight="bold" text-anchor="end" fill="${lenColor}">長度 ${length}</text>
  <text x="130" y="${DEMO_BAND_Y}" font-size="13" font-weight="bold" text-anchor="middle" fill="${frame.color}">${frame.text}</text>${frameAnim(k, n)}</g>`;
}

function animatedTour(emoji, frames) {
  const cities = TSP_DEMO_CITIES.map(([x, y], k) => `<circle cx="${x}" cy="${y}" r="7" fill="${k === 0 ? '#FFE9A8' : '#fff'}" stroke="#3d2f22" stroke-width="2"/>`).join('');
  return `<svg viewBox="0 0 260 160" class="guide-svg demo" aria-hidden="true">
  ${frames.map((f, k) => tspFrame(f, frames[k - 1], k, frames.length)).join('')}${cities}
  <text x="44" y="50" font-size="13" text-anchor="middle">🏠</text><text x="16" y="24" font-size="20" text-anchor="middle">${emoji}</text></svg>`;
}

const TRY_ALL = { color: '#1d4ed8', text: '🔍 試遍所有改法，挑最短的' };

const TSP_DEMO_SVGS = Object.freeze({
  hc: animatedTour('🐐', [

/** One shared, page-centred guide modal. open(slides, key) marks key as seen when closed. */
function getGuideModal() {
  if (guideModal) return guideModal;
  const card = h('div', { class: 'guide-card', role: 'dialog', 'aria-modal': 'true', 'aria-label': '導覽' });
  const el = h('div', { class: 'guide-overlay', hidden: true }, card);
  document.body.append(el);
  let slides = [];
  let index = 0;
  let seenKey = null;
  let onClose = null;

  /** finished = the user reached the last page (not skipped). */
  function close(finished) {
    el.hidden = true;
    if (seenKey) storage.set(GUIDE_SEEN_PREFIX + seenKey, true);
    if (onClose) onClose(finished);
  }

  function render() {
    const slide = slides[index];
    const last = index === slides.length - 1;
    card.replaceChildren(
      h('div', { class: 'guide-head' }, h('strong', null, slide.title),
        h('button', { type: 'button', class: 'help-btn', onClick: () => close(false) }, '略過導覽')),
      ...(slide.svg ? [h('div', { html: slide.svg })] : []),
      h('div', { class: 'guide-text', html: slide.html }),
      h('div', { class: 'guide-foot' },
        h('span', { class: 'dots' }, slides.map((_, i) => (i === index ? '●' : '○')).join('')),
        h('button', { type: 'button', class: 'btn', disabled: index === 0, onClick: () => { index -= 1; render(); } }, '上一頁'),
        h('button', { type: 'button', class: 'btn btn-primary', onClick: () => { if (last) close(true); else { index += 1; render(); } } },
          last ? (slide.finishLabel || '開始') : '下一頁')));
  }

  guideModal = {
    open(nextSlides, key, after = null) {
      slides = nextSlides;
      seenKey = key;
      onClose = after;
      index = 0;
      render();
      el.hidden = false;
    },
    openIfFirstTime(nextSlides, key, after = null) {
      if (storage.get(GUIDE_SEEN_PREFIX + key, false)) return false;
      this.open(nextSlides, key, after);
      return true;
    },
    hide() { el.hidden = true; },
    get isOpen() { return !el.hidden; },
  };
  return guideModal;
}

// ===== neighbour-explorer.js =====
// ---------- TSP neighbour generator (spec v1.4 item 1, four stages in spec v1.5) ----------
// Walks through every 2-opt neighbour of the current route and shows how one is made:
// ① pick two non-adjacent edges, ② cut them (two pieces), ③ reverse the blue piece's visiting order, ④ reconnect.
const EXPLAIN_STAGES = Object.freeze(['① 選 2 條線', '② 剪斷', '③ 倒過來', '④ 接回']);
const EXPLAIN_AUTOPLAY_MS = 1600;

const arrowPath = (cities) => cities.join('→');

function stageText(problem, tour, move, stage) {
  const { a, b, c, d, i, j } = move;
  const piece = tour.slice(i, j + 1);
  const rest = [...tour.slice(j + 1), ...tour.slice(0, i)];
  if (stage === 1) {
    return `從路線上挑出 ${a}–${b} 和 ${c}–${d} 這兩條線（橘色）。這兩條線沒有「相鄰」：相鄰的意思是兩條線碰到同一座城市，`
      + `例如 ${tour[0]}–${tour[1]} 和 ${tour[1]}–${tour[2]} 都接在城市 ${tour[1]} 上；相鄰的兩條線剪掉後，中間只剩一座孤零零的城市，接不出新路線。`;
  }
  if (stage === 2) {
    return `剪斷後，路線斷成兩段。藍色這段原本照 ${arrowPath(piece)} 的順序走（看藍色箭頭），另一段是 ${arrowPath(rest)}。`;
  }
  if (stage === 3) {
    return `「倒過來」＝把藍色這段拜訪城市的順序反過來：${arrowPath(piece)} 變成 ${arrowPath([...piece].reverse())}。`
      + '城市的位置不會動，只是走的方向反了：藍色箭頭反向，城市旁邊的順序編號也跟著對調。';
  }
  const newLength = tourLength(problem, reverseSegment(tour, i, j));
  const change = newLength - tourLength(problem, tour);
  return `最後用綠色的 ${a}–${c}、${b}–${d} 把兩段接回成一圈，就得到一條新路線。新長度 ${fmt1(newLength)}`
    + `（${change < 0 ? '短了' : '長了'} ${fmt1(Math.abs(change))}）。`;
}

/** onPreview({ tour, move, stage }) shows the stage on the map; onPreview(null) clears it. */
function createNeighbourExplorer({ onPreview }) {
  let problem = null;
  let tour = null;
  let moves = [];
  let index = 0;
  let stage = 1;
  let active = false;
  let timer = null;
  const counter = h('span', { class: 'ex-counter' });
  const stageBtns = EXPLAIN_STAGES.map((label, k) => h('button', {
    type: 'button', class: 'seg-btn', 'aria-pressed': 'false', onClick: () => { stopAuto(); show(index, k + 1); },
  }, label));
  const text = h('p', { class: 'ex-text' });
  const chips = h('div', { class: 'ex-chips' });
  const autoBtn = h('button', { type: 'button', class: 'btn btn-small btn-primary', onClick: () => autoPlay() }, '▶ 播放這個鄰居怎麼產生');
  const endBtn = h('button', { type: 'button', class: 'btn btn-small', onClick: () => deactivate() }, '結束預覽');
  const rule = h('div', { class: 'ex-rule' });
  const body = h('div', { class: 'ex-body', hidden: true },
    h('div', { class: 'ex-nav' },
      h('button', { type: 'button', class: 'btn btn-small', onClick: () => { stopAuto(); show((index - 1 + moves.length) % moves.length, 1); } }, '◀'),
      counter,
      h('button', { type: 'button', class: 'btn btn-small', onClick: () => { stopAuto(); show((index + 1) % moves.length, 1); } }, '▶')),
    h('div', { class: 'segmented ex-stages' }, stageBtns), text, chips, h('div', { class: 'row' }, autoBtn, endBtn));
  const openBtn = h('button', { type: 'button', class: 'btn btn-primary', onClick: () => { show(0, 1); } }, '🔍 一個一個看鄰居怎麼產生');

  function stopAuto() {
    clearTimeout(timer);
    timer = null;
  }

  function autoPlay() {
    stopAuto();
    show(index, 1);
    const advance = (next) => {
      timer = setTimeout(() => {
        show(index, next);
        if (next < EXPLAIN_STAGES.length) advance(next + 1);
      }, EXPLAIN_AUTOPLAY_MS);
    };
    advance(2);
  }

  function show(k, s) {
    if (!moves.length) return;
    active = true;
    index = k;
    stage = s;
    const move = moves[index];
    counter.textContent = `第 ${index + 1} / ${moves.length} 個鄰居：拆 ${move.a}–${move.b}、${move.c}–${move.d}`;
    stageBtns.forEach((btn, n) => btn.setAttribute('aria-pressed', String(n + 1 === stage)));
    text.textContent = stageText(problem, tour, move, stage);
    const flipped = stage >= 3;
    chips.replaceChildren(h('div', { class: 'seq' }, h('span', { class: 'seq-label' }, flipped ? '倒過來之後' : '目前的順序'),
      cityChips(flipped ? reverseSegment(tour, move.i, move.j) : tour, move.i, move.j, flipped ? 'seg-new' : 'seg-piece')));
    body.hidden = false;
    openBtn.hidden = true;
    onPreview({ tour, move, stage });
  }

  function deactivate() {
    stopAuto();
    if (!active) return;
    active = false;
    body.hidden = true;
    openBtn.hidden = false;
    onPreview(null);
  }

  return {
    el: h('section', { class: 'panel explorer' }, h('h3', { class: 'panel-title' }, '🔀 鄰居是怎麼產生的？'), rule, openBtn, body),
    /** Called whenever the route may have changed (new problem, step, reset). Ends any running preview. */
    update(run) {
      deactivate();
      problem = run.problem;
      tour = run.state.current.pos;
      moves = OPS_TSP.neighbors(problem, tour).map((m) => m.move);
      const n = problem.n;
      rule.replaceChildren(
        h('p', null, h('b', null, '① 挑 2 條線 → ② 剪斷 → ③ 中間那段倒過來 → ④ 接回'), '，就得到一個鄰居。'),
        h('details', { class: 'ex-more' }, h('summary', null, '名詞說明'), h('ul', { class: 'ex-defs' },
          h('li', null, h('b', null, '相鄰：'), '兩條線碰到同一座城市（共用一個端點）。'),
          h('li', null, h('b', null, '倒過來：'), '把那一段「拜訪城市的順序」反過來走，例如 3→2 變成 2→3；城市位置不變。'),
          h('li', null, h('b', null, '有幾個鄰居：'), `路線有 ${n} 條線；每條線不能配自己、也不能配左右相鄰的 2 條，所以有 ${n}−3 條可以配；`
            + `每一組會被兩條線各算一次要 ÷2 → ${n}×(${n}−3)÷2 = ${moves.length} 個鄰居。`))));
    },
    deactivate,
  };
}

// ---------- TSP small multiples: one square map per animal (spec v1.2, item 4) ----------
function createTspTrio() {
  const grid = h('div', { class: 'trio' });
  let slots = new Map();
  let order = '';
  let problem = null;
  let showAnswer = false;

  function makeSlot(algo) {
    const canvas = h('canvas', { class: 'square-canvas', 'aria-label': `${ALGOS[algo].animal}的路線` });
    const view = new MapView(canvas, { square: true, showCandidates: true });
    view.setProblem(problem);
    view.showAnswer = showAnswer;
    const label = h('span', { class: 'trio-value' });
    const el = h('div', { class: 'trio-slot', style: `--agent:${ALGOS[algo].color}` },
      h('div', { class: 'trio-head' }, agentImg(algo, 26), h('strong', null, ALGOS[algo].animal), label), canvas);
    return { view, label, el };
  }

  function rebuild(algos) {
    slots.forEach((s) => s.view.destroy());
    slots = new Map(algos.map((a) => [a, makeSlot(a)]));
    grid.replaceChildren(...[...slots.values()].map((s) => s.el));
    order = algos.join(',');
  }

  return {
    el: grid,
    setProblem(next) {
      problem = next;
      rebuild([]);
    },
    setShowAnswer(value) {
      showAnswer = value;
      slots.forEach((s) => { s.view.showAnswer = value; });
    },
    update(runs) {
      const algos = runs.map((r) => r.algo);
      if (algos.join(',') !== order) rebuild(algos);
      runs.forEach((r) => {
        const slot = slots.get(r.algo);
        slot.view.setAgents([{ key: r.algo, run: r }]);
        slot.label.textContent = `目前 ${fmt1(r.state.current.display)}｜最佳 ${fmt1(r.state.best.display)}${r.state.stopped ? ' 💤' : ''}`;
      });
    },
  };
}

  const vizRow = h('div', { class: 'viz-row' }, h('div', { class: 'viz-canvas' }, hint.el, canvas), magnifier.el);

  function loadProblem() {
    player.pause();
    problem = buildProblem(config);
    start = problem.start;
    startCounter = 0;
    view.setProblem(problem);
    params.set({ type: config.type, values: paramsByAlgo[algo] });
    vizRow.classList.toggle('with-side', problem.type === '2d');
    explorer.el.hidden = problem.type !== 'tsp';
    // The site tour comes first on a brand-new visit; the problem guide waits until it is done.
    if (!siteTourPending()) getGuideModal().openIfFirstTime(problemSlides(problem), problemGuideKey(problem.type));
    resetRun();
  }

  function selectAlgo(next) {
    player.pause();
    algo = next;
    cards.set(algo);
    params.set({ algos: [algo], values: paramsByAlgo[algo] });
    resetRun();
  }

  function resetRun() {
    run = createRun({ algo, problem, params: paramsByAlgo[algo], start, seed: config.seed });
    past = [];
    params.setPending(false);
    stepCard.setAlgo(algo, problem);
    const meta = ALGOS[algo];
    stepCard.reset(`${meta.animal}準備好了！按「⏭ 下一步」一步一步看，或按「▶ 播放」連續執行。${problem.type === 'tsp' ? '' : '也可以點地圖換起點。'}`);
    history.clear();
    if (problem.type === 'tsp') explorer.update(run);
    refresh();
  }

  function refresh() {
    const rec = lastRecord(run);
    view.setAgents([{ key: algo, run }]);
    status.update(run, player.playing);
    magnifier.update(run, rec);
    tspDetail.update(run, rec);
    summary.update(problem, run.params);
  }

  function doStep() {
    if (run.state.stopped) return false;
    past = [...past, run];
    run = stepRun(run);
    const rec = lastRecord(run);
    stepCard.show(run, rec);
    history.add(rec.step, narrate(run, rec));
    if (rec.stopped === 'local' && !foundGlobal(run)) stepCard.showStuck(selectAlgo);
    if (problem.type === 'tsp') explorer.update(run);
    refresh();
    return !run.state.stopped;
  }

  /** Spec v1.4 item 3: go back one step by restoring the previous (immutable) run. */
  function stepBack() {
    player.pause();
    if (!past.length) {
      hint.show('已經在第 0 步了');
      return;
    }
    run = past[past.length - 1];
    past = past.slice(0, -1);
    const rec = lastRecord(run);
    history.clear();
    run.records.slice(-MAX_HISTORY).forEach((r) => history.add(r.step, narrate(run, r)));
    if (rec) stepCard.show(run, rec);
    else stepCard.reset('回到第 0 步了。按「⏭ 下一步」重新開始。');
    if (problem.type === 'tsp') explorer.update(run);
    refresh();
  }

  function openProblemGuide(p) {
    getGuideModal().open(problemSlides(p), problemGuideKey(p.type));
  }

  function handleMapClick({ pos }) {
    if (pos === undefined) return;
    if (run.state.step > 0) {
      hint.show('先按「↺ 重置」才能更換起點');
      return;
    }
    start = pos;
    resetRun();
  }

  function randomStart() {
    player.pause();
    startCounter += 1;
    start = randomStartFor(problem, config.seed, startCounter);
    resetRun();
  }

  const el = h('div', { class: 'layout-3' },
    h('aside', { class: 'col-left' }, picker.el, cards.el, params.el),
    h('div', { class: 'col-main' },
      h('div', { class: 'canvas-wrap' }, summary.el, vizRow, tspDetail.topEl, explorer.el),
      h('div', { class: 'canvas-tools' },
        h('button', { type: 'button', class: 'btn btn-small', onClick: randomStart }, '🎲 隨機起點'),
        h('button', { type: 'button', class: 'btn btn-small guide-btn', onClick: () => openProblemGuide(problem) }, '📘 這個問題的導覽'),
        h('label', { class: 'toggle' }, answerToggle, ' 顯示答案 ⭐')),
      controls.el,
      stepCard.el,
      tspDetail.el),
    h('aside', { class: 'col-right' }, status.el, history.el));

  loadProblem();
  return {
    el,
    deactivate: () => player.pause(),
    openGuideIfFirstTime: () => getGuideModal().openIfFirstTime(problemSlides(problem), problemGuideKey(problem.type)),
    onKey(action) {
      if (action === 'toggle') player.toggle();
      if (action === 'step') { player.pause(); doStep(); }
      if (action === 'back') stepBack();
      if (action === 'reset') { player.pause(); resetRun(); }
    },
  };
}

/** F-82: same map, start and step budget; each algorithm gets its own random stream from the seed. */
function createRaceRuns(problem, start, seed, algos, paramsByAlgo) {
  return algos.map((algo, i) => createRun({ algo, problem, params: paramsByAlgo[algo], start, seed: seed + i + 1 }));
}

function rankRuns(runs) {
  const better = runs[0].ops.isBetter;
  return [...runs].sort((a, b) => (better(a.state.best.display, b.state.best.display) ? -1
    : better(b.state.best.display, a.state.best.display) ? 1 : 0));
}

function resultTable(runs) {
  const best = rankRuns(runs)[0].state.best.display;
  const isWinner = (r) => Math.abs(r.state.best.display - best) < 1e-6;
  const vn = runs[0].ops.valueName;
  return h('table', { class: 'result-table' },
    h('thead', null, h('tr', null, h('th', null, '角色'), h('th', null, `最終最佳${vn}`), h('th', null, '第幾步找到'), h('th', null, '找到全域最佳？'))),
    h('tbody', null, runs.map((r) => h('tr', { class: isWinner(r) ? 'winner' : '' },
      h('td', null, agentImg(r.algo, 22), ` ${ALGOS[r.algo].animal}`, isWinner(r) ? ' 👑' : ''),
      h('td', null, fmt1(r.state.best.display)),
      h('td', null, String(r.state.bestStep)),
      h('td', null, foundGlobal(r) ? '✓' : '✗')))));
}

/** One plain-language line per animal under the result table (spec v1.4 review fix). */
function compareNotes(runs) {
  const notes = runs.map((r) => {
    const won = foundGlobal(r);
    if (r.algo === 'hc') return won ? '🐐 山羊一路往更好的方向走，就到了最佳解。' : `🐐 山羊在第 ${r.state.step} 步就停了：四周都沒有更好的鄰居，卡在局部最佳。`;
    if (r.algo === 'sa') return `🐲 小龍接受了 ${r.state.worseAccepts} 次變差的移動，${won ? '最後找到了最佳解。' : '但沒有找到最佳解。'}`;
    return won ? '🦊 狐狸被禁忌表逼著繼續往外走，找到了最佳解。' : '🦊 狐狸繞了一圈，還是沒找到最佳解。';
  });
  return h('div', { class: 'compare-notes' }, notes.map((t) => h('p', null, t)));
}

    h('div', { class: 'col-main' },
